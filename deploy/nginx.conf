# nginx reverse proxy for the HPP salary calculator.
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/amazoncalculate
#   sudo sed -i 's/example.com/yourdomain.com/g' /etc/nginx/sites-available/amazoncalculate
#   sudo ln -s /etc/nginx/sites-available/amazoncalculate /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS afterwards:  sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # standard access log — the deploy/visitors.sh helper aggregates unique
    # daily visitors from it; no tracking code exists in the app itself
    access_log /var/log/nginx/amazoncalculate.access.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # node rate-limits by this header (TRUST_PROXY=1)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
